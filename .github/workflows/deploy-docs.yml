name: Deploy Documentation

on:
  push:
    branches:
      - documentation
    paths:
      - '.github/workflows/deploy-docs.yml'
      - 'documentation/wiki/**'
      - 'documentation/scripts/**'
      - 'documentation/visual-tests/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs and dependencies
        run: pip install "mkdocs>=1.6,<2.0" mkdocs-material

      - name: Check documentation CSS architecture
        run: bash documentation/scripts/check-docs-css.sh

      - name: Build documentation site
        run: mkdocs build --strict

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: documentation/visual-tests/package-lock.json

      - name: Install documentation layout-test dependencies
        working-directory: documentation/visual-tests
        run: npm ci

      - name: Install Chromium for layout tests
        working-directory: documentation/visual-tests
        run: npx playwright install --with-deps chromium

      - name: Run documentation layout tests
        working-directory: documentation/visual-tests
        run: npm test

      - name: Upload documentation layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-layout-screenshots
          path: documentation/visual-tests/test-results/
          if-no-files-found: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
