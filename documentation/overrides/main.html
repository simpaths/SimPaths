{% extends "base.html" %}

{# Main navigation lives inside the header. #}
{% block tabs %}{% endblock %}

{% block content %}
  {{ super() }}
  {% include "partials/page-navigation.html" %}
{% endblock %}

{% block extrahead %}
  {{ super() }}
  <meta property="og:site_name" content="{{ config.site_name | e }}">
  {% if page and page.is_homepage %}
  <script type="application/ld+json">
    {{ {"@context": "https://schema.org", "@type": "WebSite", "name": config.site_name, "url": config.site_url} | tojson }}
  </script>
  {% endif %}
  <link rel="preload" href="{{ 'assets/fonts/Inter.woff2' | url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ 'assets/images/homepage-hero-logo.svg' | url }}" as="image" type="image/svg+xml">
  <script>
    (() => {
      const classes = [];
      {% if page and page.is_homepage %}classes.push("sp-page-home");{% endif %}
      {% if page and page.url == "documentation/" %}classes.push("sp-page-docs-index");{% endif %}
      {% if page and page.url == "funding/" %}classes.push("sp-page-funding");{% endif %}
      {% if page and page.url == "overview/roadmap/" %}classes.push("sp-page-roadmap");{% endif %}
      {% if page and page.url == "validation/" %}classes.push("sp-page-validation");{% endif %}
      {% if page %}
        {% set visible_toc = page.toc %}
        {% set first_heading = visible_toc | first %}
        {% if first_heading and first_heading.level == 1 %}{% set visible_toc = first_heading.children %}{% endif %}
        {% if not visible_toc or (page.meta.hide and "toc" in page.meta.hide) %}classes.push("sp-no-toc");{% endif %}
      {% endif %}
      {% if page and page.url.startswith("overview/") %}classes.push("sp-tab-model");{% endif %}
      {% if page and page.url.startswith(("documentation/", "getting-started/", "user-guide/", "developer-guide/", "jasmine-reference/")) %}classes.push("sp-tab-documentation");{% endif %}
      document.documentElement.classList.add(...classes);
    })();
  </script>
{% endblock %}
