# Health spending with the 2026 age structure held fixed within sex and region.
# Pair with age_sex_health_costs_baseline_2060.yml and compare annual scenario spending.

maxNumberOfRuns: 1
executeWithGui: false
randomSeed: 606
startYear: 2021
endYear: 2060
popSize: 50000

parameter_args:
  populationProjectionFilename: align_popProjections_no_ageing_2026.xlsx
  UKMODpolicyScheduleFilename: UKMODpolicySchedule_wealth_scenarios

model_args:
  bequestSyntheticRecipientCount: 2
  alignPopulation: true
  alignCohabitation: true
  alignFertility: true
  FERTILITY_ALIGNMENT_END_YEAR: 2060
  PARTNERSHIP_ALIGNMENT_END_YEAR: 2060

collector_args:
  persistHealthSpendingStatistics: true
  healthCostProfileFilename: age_by_sex_health_cost_profile.xlsx
